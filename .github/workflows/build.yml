# Тесты и сборка APK на каждый push. В ветке main подписанный APK публикуется в GitHub Releases.
# Не переименовывать файл: от его имени зависит счётчик сборок, а значит и versionCode.
name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты логики
        run: ./gradlew --no-daemon :core:test

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.ODS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ODS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Ключа подписи ещё нет — APK соберётся, но в Releases не попадёт. Как создать ключ — в README."
          fi

      - name: Сборка release-APK
        env:
          ODS_KEYSTORE_PASSWORD: ${{ secrets.ODS_KEYSTORE_PASSWORD }}
          ODS_KEY_ALIAS: ${{ secrets.ODS_KEY_ALIAS }}
          ODS_KEY_PASSWORD: ${{ secrets.ODS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Проверка подписи
        if: env.SIGNED == '1'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -v -i "digest" || true
          "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk

      - name: Публикация в Releases
        if: env.SIGNED == '1' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="ods-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          MSG=$(git log -1 --pretty=%s)
          gh release create "v$VERSION_NAME" "$APK" \
            --title "ОДС $VERSION_NAME" \
            --notes "Скачайте файл $APK ниже и установите поверх прежней версии. Прогресс сохранится. Изменения: $MSG" \
            --target "$GITHUB_SHA" \
            --latest
